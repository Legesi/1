services:
  quant:
    build: .
    ports:
      - "8765:8765"
    environment:
      OPENCLAW_QUANT_TELEGRAM_TOKEN: "${OPENCLAW_QUANT_TELEGRAM_TOKEN:-}"
      OPENCLAW_QUANT_TELEGRAM_CHAT_ID: "${OPENCLAW_QUANT_TELEGRAM_CHAT_ID:-}"
      OPENCLAW_QUANT_DISCORD_WEBHOOK: "${OPENCLAW_QUANT_DISCORD_WEBHOOK:-}"
    volumes:
      - quant-data:/app/data
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openclaw_quant
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}"
volumes:
  quant-data:
